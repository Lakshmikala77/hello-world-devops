name: Build and Sonar Analysis

on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SonarScanner
        run: |
          dotnet tool install --global dotnet-sonarscanner

      - name: Begin Sonar Scan
        run: |
          dotnet-sonarscanner begin /k:"Lakshmikala77_hello-world-devops" /o:"lakshmikala77" /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Restore
        run: dotnet restore HelloWorldApi/HelloWorldApi.csproj

      - name: Build
        run: dotnet build HelloWorldApi/HelloWorldApi.csproj --no-restore

      - name: End Sonar Scan
        run: |
          dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
